# テスト実行 CI (Phase 1: テストのみ。安全チェック類は Phase 4 で追加予定)
# ジョブ ID "test" はブランチ保護の required status check 名として参照される。
# 変更する場合は config.json の branch_protection.required_status_checks も更新すること。
name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # ルート自体が mgtkit パッケージのため、チェックアウト先フォルダ名は
          # mgtkit 必須 (`from mgtkit.x import y` と pytest のパッケージ解決が
          # フォルダ名に依存する。app.py の実行時要件と同じ)。
          path: mgtkit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mgtkit/requirements-dev.txt

      - name: 依存インストール
        working-directory: mgtkit
        run: pip install -r requirements-dev.txt

      # 日本語フォント (fonts-noto-cjk) は Phase 1 では不要。
      # 描画内容を検証する画像回帰テスト導入時 (Phase 2 以降) に追加を検討:
      #   sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: テスト実行
        working-directory: mgtkit
        run: python -m pytest -v
