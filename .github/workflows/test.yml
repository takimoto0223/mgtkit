# テスト実行 CI (Phase 1: テストのみ。安全チェック類は Phase 4 で追加予定)
# ジョブ ID "test" はブランチ保護の required status check 名として参照される。
# 変更する場合は config.json の branch_protection.required_status_checks も更新すること。
name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # ルート自体が mgtkit パッケージのため、チェックアウト先フォルダ名は
          # mgtkit 必須 (`from mgtkit.x import y` と pytest のパッケージ解決が
          # フォルダ名に依存する。app.py の実行時要件と同じ)。
          path: mgtkit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mgtkit/requirements-dev.txt

      - name: 依存インストール
        working-directory: mgtkit
        run: pip install -r requirements-dev.txt

      # 日本語フォント (fonts-noto-cjk) は Phase 1 では不要。
      # 描画内容を検証する画像回帰テスト導入時 (Phase 2 以降) に追加を検討:
      #   sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: テスト実行
        working-directory: mgtkit
        run: python -m pytest -v

  # 安全チェック。PR のみ実行。
  safety:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gitleaks はアクション (gitleaks-action) ではなくバイナリを直接実行する。
      # アクションの取得解決が GitHub 側の障害で失敗し CI が止まった実績があるため、
      # 外部アクションへの依存を減らしている。検出時はこのステップが fail する。
      - name: 秘密情報スキャン (gitleaks)
        env:
          GITLEAKS_VERSION: 8.18.4
        run: |
          curl -sSfL --retry 3 -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --no-banner

      - name: 依存監査 (pip-audit、requirements.txt 変更時のみ)
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qx 'requirements.txt'; then
            pip install --quiet pip-audit
            # 検出は承認時の判断材料とする (ブロックはしない)
            pip-audit -r requirements.txt \
              || echo "::warning::pip-audit が既知の脆弱性を検出しました。承認時に確認してください。"
          else
            echo "requirements.txt に変更はありません"
          fi

      - name: 自動修正コミットの tests/ 変更ガード
        run: |
          python3 - <<'EOF'
          # [auto-fix] コミットが tests/ を変更していたら fail
          import subprocess, sys
          base = 'origin/${{ github.base_ref }}'
          commits = subprocess.check_output(
              ['git', 'rev-list', base + '..HEAD'], text=True).split()
          bad = []
          for c in commits:
              subject = subprocess.check_output(
                  ['git', 'log', '-1', '--format=%s', c], text=True).strip()
              if not subject.startswith('[auto-fix]'):
                  continue
              files = subprocess.check_output(
                  ['git', 'diff-tree', '--no-commit-id', '--name-only',
                   '-r', c], text=True).split()
              bad += ['%s: %s' % (c[:8], f) for f in files
                      if f.startswith('tests/')]
          if bad:
              print('自動修正コミットが tests/ を変更しています:')
              print('\n'.join(bad))
              sys.exit(1)
          print('ガード OK')
          EOF

  # 提出 (feature/*) の検証がすべて通ったらβ版を自動リリース
  beta-release:
    needs: [test, safety]
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: mgtkit

      - name: 次のβ版バージョンを決定
        id: ver
        working-directory: mgtkit
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          # 最新安定版 vX.Y の次 (vX.Y+1) に対する -beta.N を採番する
          import re
          import subprocess
          tags = subprocess.check_output(['git', 'tag', '-l'],
                                         text=True).split()
          stable = []
          for t in tags:
              m = re.match(r'^v(\d+)\.(\d+)$', t)
              if m:
                  stable.append((int(m.group(1)), int(m.group(2))))
          if stable:
              major, minor = max(stable)
              base = 'v%d.%d' % (major, minor + 1)
          else:
              base = 'v1.0'
          n = 0
          for t in tags:
              m = re.match(re.escape(base) + r'-beta\.(\d+)$', t)
              if m:
                  n = max(n, int(m.group(1)))
          print('version=%s-beta.%d' % (base, n + 1))
          EOF

      - name: version.json 生成と配布 ZIP 作成
        working-directory: mgtkit
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          python3 - <<'EOF'
          import datetime, json, os, subprocess
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'],
                                        text=True).strip()
          with open('version.json', 'w', encoding='utf-8') as f:
              json.dump({'version': os.environ['VERSION'],
                         'commit': sha,
                         'distributed_at':
                             datetime.date.today().isoformat()},
                        f, ensure_ascii=False, indent=2)
          EOF
          zip -r "../mgtkit-${VERSION}.zip" . \
            -x '.git/*' -x '.github/*' -x 'tests/*' -x 'docs/*' \
            -x 'scripts/*' -x 'manager/*' -x '.pytest_cache/*' \
            -x 'pytest.ini' -x 'requirements-dev.txt' -x '.gitignore' \
            -x 'CLAUDE.md' -x '.gitattributes'

      - name: プレリリースとして登録
        working-directory: mgtkit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh release create "$VERSION" "../mgtkit-${VERSION}.zip" \
            --prerelease --title "$VERSION" --target "$HEAD_SHA" \
            --notes "提出 #${PR_NUMBER} (${PR_TITLE}) の検証通過版です。マネージャーのβ版タブから試用できます。"
